# Render deployment configuration without Docker.
services:
  - type: web
    name: career-platform-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: "."
      - key: DEBUG
        value: "false"
      - key: ENABLE_VECTOR_DB
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_MODEL_PROVIDER
        value: "gemini"
      - key: MONGODB_URL
        sync: false

  - type: web
    name: career-platform-ui
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r frontend/requirements.txt
    startCommand: streamlit run frontend/app.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PYTHONPATH
        value: "."
      - key: API_BASE_URL
        value: "https://careerpilot-4ygm.onrender.com"
